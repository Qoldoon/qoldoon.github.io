<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Game Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #e8e8e8;
    --accent2: #555;
    --radius: 14px;
    --font: 'SF Pro Display', -apple-system, 'Helvetica Neue', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  header {
    padding: 48px 32px 24px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .title-block h1 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .title-block p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  .clip-count {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 28px 32px;
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }

  .card:active { transform: scale(0.98); }
  .card:hover { border-color: var(--border-hover); }

  .thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .thumb-num {
    font-size: 48px;
    font-weight: 200;
    color: var(--accent2);
    letter-spacing: -2px;
  }

  .play-btn {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 0.5px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
  }

  .play-btn svg { margin-left: 3px; }

  .card-info {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-label {
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
  }

  .card-tag {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 0.5px solid var(--border);
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }

  /* Modal overlay */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal.open { display: flex; }

  .modal-inner {
    width: 100%;
    max-width: 900px;
    position: relative;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .modal-title {
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
  }

  .close-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 18px;
    font-weight: 300;
    transition: background 0.15s, color 0.15s;
  }

  .close-btn:hover { background: var(--surface); color: var(--text); }

  .video-wrap {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }

  .video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    outline: none;
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    gap: 12px;
  }

  .nav-btn {
    flex: 1;
    padding: 12px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, border-color 0.15s;
  }

  .nav-btn:hover { background: var(--surface2); border-color: var(--border-hover); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .nav-indicator {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.04em;
  }

  footer {
    padding: 20px 32px 36px;
    border-top: 0.5px solid var(--border);
    text-align: center;
    font-size: 12px;
    color: var(--accent2);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Game Demo</h1>
    <p>Tap a clip to watch</p>
  </div>
  <span class="clip-count" id="clip-count"></span>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="close-btn" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="video-wrap">
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">&#8592; Previous</button>
      <span class="nav-indicator" id="nav-indicator"></span>
      <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next &#8594;</button>
    </div>
  </div>
</div>

<footer>Bachelor's Presentation &mdash; Demo Reel</footer>

<script>
// ─────────────────────────────────────────────
// EDIT YOUR CLIPS HERE
// Each entry: { label, tag, url }
// label = name shown on card and in modal
// tag   = short descriptor (e.g. "Gameplay", "UI", "Boss Fight")
// url   = direct link to your video file
// ─────────────────────────────────────────────
const clips = [
  {
    label: "Core Gameplay Loop",
    tag: "Gameplay",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  },
  {
    label: "Main Menu & Navigation",
    tag: "UI",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  },
  {
    label: "Level Progression",
    tag: "Progression",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  },
  {
    label: "Special Mechanics",
    tag: "Feature",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  }
];
// ─────────────────────────────────────────────

let current = 0;
const player = document.getElementById('player');
const modal = document.getElementById('modal');

document.getElementById('clip-count').textContent = clips.length + ' clips';

const grid = document.getElementById('grid');
clips.forEach((clip, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb">
      <span class="thumb-num">0${i+1}</span>
      <div class="play-btn">
        <svg width="14" height="16" viewBox="0 0 14 16" fill="none">
          <path d="M1 1L13 8L1 15V1Z" fill="rgba(255,255,255,0.9)"/>
        </svg>
      </div>
    </div>
    <div class="card-info">
      <span class="card-label">${clip.label}</span>
      <span class="card-tag">${clip.tag}</span>
    </div>
  `;
  card.addEventListener('click', () => openModal(i));
  grid.appendChild(card);
});

function openModal(index) {
  current = index;
  loadClip(index);
  modal.classList.add('open');
}

function closeModal() {
  player.pause();
  player.src = '';
  modal.classList.remove('open');
}

function loadClip(index) {
  const clip = clips[index];
  document.getElementById('modal-title').textContent = clip.label;
  document.getElementById('nav-indicator').textContent = `${index + 1} / ${clips.length}`;
  document.getElementById('prev-btn').disabled = index === 0;
  document.getElementById('next-btn').disabled = index === clips.length - 1;
  player.src = clip.url;
  player.load();
  player.play();
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < clips.length) {
    current = next;
    loadClip(current);
  }
}

// Prevent accidental swipe-back gesture on iOS
document.addEventListener('touchmove', e => {
  if (modal.classList.contains('open')) e.stopPropagation();
}, { passive: false });
</script>

</body>
</html>
